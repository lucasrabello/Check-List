<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema Checklist PCP</title>

<style>
body{
    font-family: Arial, sans-serif;
    margin:0;
    background:#f2f2f2;
    color:#333;
}

header{
    background:#2c3e50;
    color:white;
    padding:20px;
}

h1{ margin:0; }

.container{
    max-width:1200px;
    margin:auto;
    padding:20px;
}

.card{
    background:white;
    padding:20px;
    margin-bottom:20px;
    border-radius:8px;
    box-shadow:0 2px 6px rgba(0,0,0,0.1);
}

input, select{
    padding:6px;
    margin:5px;
}

button{
    padding:8px 15px;
    border:none;
    background:#2c3e50;
    color:white;
    cursor:pointer;
    border-radius:4px;
}

button:hover{ opacity:0.9; }

table{
    width:100%;
    border-collapse:collapse;
}

th, td{
    padding:8px;
    border-bottom:1px solid #ddd;
}

th{
    background:#ecf0f1;
}

.sim{ background:#2ecc71; color:white;}
.nao{ background:#e74c3c; color:white;}
.pendente{ background:#f1c40f; }

.footer-sign{
    margin-top:40px;
    font-weight:bold;
}

.header-grid{
    display:grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap:10px;
}
</style>
</head>
<body>

<header>
<h1>Sistema de Checklist PCP</h1>
</header>

<div class="container">

<div class="card">
<h3>Dados do Projeto</h3>

<div class="header-grid">
<div>
Cliente:<br>
<input type="text" id="cliente">
</div>

<div>
Ambiente:<br>
<input type="text" id="ambiente">
</div>

<div>
Data:<br>
<input type="date" id="data">
</div>

<div>
Responsável:<br>
<input type="text" id="responsavel">
</div>
</div>

<br>
<button onclick="novoChecklist()">Novo</button>
<button onclick="salvarChecklist()">Salvar</button>
</div>

<div class="card">
<h3>Pesquisar Checklist</h3>
<select id="listaSalvos" onchange="carregarChecklist()" style="width:300px;">
<option value="">Selecionar Cliente / Ambiente</option>
</select>
</div>

<div class="card">
<h3>Checklist</h3>
<table id="tabelaChecklist">
<tr>
<th>Item</th>
<th>Status</th>
</tr>
</table>

<div class="footer-sign">
Responsável PCP:
<input type="text" id="assinatura" style="width:400px">
</div>

</div>

</div>

<script>

const itens = [

// (LISTA COMPLETA MANTIDA)

"CONFERIR ELETROS",
"CONFERIR MEDIDA DAS PAREDES A PARTIR DA MEDIDA CONFIRMADA",
"CONFERIR A PE DIREITO DA PAREDE",
"CONFERIR CANOS AGUA E ESGOTO",
"CONFERIR PONTOS PARA ARANDELA",
"CONFERIR TOMADAS E INTERRUPTORES",
"CONFERIR MEDIDAS DE PORTA DE PASSAGEM",
"CONFERIR AFASTAMENTO DO VASO SANITÁRIO ATÉ O MOVEL 250 A 300 MM",
"CONFERIR NOME DOS MATERIAIS (MDF/ LACA OU LAMINA)",
"CONFERIR MDF INTERNO",
"CONFERIR O VEIO DOS MDFS AMADEIRADO",
"CONFERIR FOLGAS DAS FRENTE E ENTRE AS FRENTES",
"CONFERIR SE TEM FILETES OU BOSERIE",
"CONFERIR MARCA DAS FERRAGENS",
"CONFERIR SE A CORREDIÇA É OCULTA OU GAVETA METÁLICA",
"CONFERIR ACESSORIOS (PORTA TEMPERO; LIXEIRA; PORTA VASSOURAS)",
"CONFERIR FITAS DE LED",
"CONFERIR METAL",
"CONFERIR ESTOFADO",
"CONFERIR TOALHEIRO",
"BALANÇO DE PEDRA 10 MM",
"CONFERIR ALTURA E PROFUNDIDADE DAS GAVETAS",
"TIRAR PARAFUSOS FRONTAIS E LATERAIS DAS GAVETAS",
"CONFERIR FURAÇÕES",
"RECUO DE RODAPÉ 30 MM",
"ADICIONAR PUXADOR",
"ADICIONAR RODAPE ULTRA",
"RECORTE FUNDO PARA CANOS",
"CONFERIR USINAGENS",
"EXPORTAR LISTA DE COMPRAS",
"EXPORTAS LISTA DE PEÇAS",
"EXPORTAR LISTA JSON",
"ENTREGA DE QUANTIDADE FINAL DE MATERIAIS ALLAN COMPRAS",
"EXPORTAR OF’s INTERNO (CLEBER)",
"EXPORTAR OF’s EXTERNO (ESTOFADOR/ SERRALHEIRO/ CLASSICO EDINHO)",
"IMPRIMIR LISTA DE COMPRAS (SEPARAR EM 2 PARTES: COMPRAS/ PROJETO)",
"IMPRIMIR ETIQUETAS",
"IMPRIMIR PLANO DE CORTE",
"ENVIAR ETIQUETAS E PLANO DE CORTE E ANOTAR JUNTO AP WESLEY"
];

const tabela = document.getElementById("tabelaChecklist");

function criarTabela(){
    tabela.innerHTML="<tr><th>Item</th><th>Status</th></tr>";
    itens.forEach((item,index)=>{
        let row = tabela.insertRow();
        row.insertCell(0).innerText=item;
        let select=document.createElement("select");
        select.innerHTML=`
        <option value="">Selecione</option>
        <option value="sim">Sim</option>
        <option value="nao">Não</option>
        <option value="pendente">Pendente</option>`;
        select.onchange=function(){mudarCor(this);salvarAutomatico();}
        row.insertCell(1).appendChild(select);
    });
}

function mudarCor(select){
    select.className="";
    if(select.value==="sim") select.className="sim";
    if(select.value==="nao") select.className="nao";
    if(select.value==="pendente") select.className="pendente";
}

function gerarChave(cliente,ambiente){
    return "check_"+cliente+"_"+ambiente;
}

function salvarChecklist(){
    let cliente=document.getElementById("cliente").value;
    let ambiente=document.getElementById("ambiente").value;

    if(!cliente||!ambiente){alert("Preencha Cliente e Ambiente");return;}

    let dados={
        data:document.getElementById("data").value,
        responsavel:document.getElementById("responsavel").value,
        assinatura:document.getElementById("assinatura").value,
        status:[]
    };

    document.querySelectorAll("select").forEach(s=>{
        dados.status.push(s.value);
    });

    localStorage.setItem(gerarChave(cliente,ambiente),JSON.stringify(dados));
    atualizarLista();
}

function salvarAutomatico(){
    let cliente=document.getElementById("cliente").value;
    let ambiente=document.getElementById("ambiente").value;
    if(cliente&&ambiente) salvarChecklist();
}

function carregarChecklist(){
    let chave=document.getElementById("listaSalvos").value;
    if(!chave) return;

    let dados=JSON.parse(localStorage.getItem(chave));
    let partes=chave.replace("check_","").split("_");

    document.getElementById("cliente").value=partes[0];
    document.getElementById("ambiente").value=partes[1];
    document.getElementById("data").value=dados.data;
    document.getElementById("responsavel").value=dados.responsavel;
    document.getElementById("assinatura").value=dados.assinatura;

    document.querySelectorAll("select").forEach((s,i)=>{
        s.value=dados.status[i];
        mudarCor(s);
    });
}

function atualizarLista(){
    let lista=document.getElementById("listaSalvos");
    lista.innerHTML="<option value=''>Selecionar Cliente / Ambiente</option>";

    for(let key in localStorage){
        if(key.startsWith("check_")){
            let nome=key.replace("check_","");
            let option=document.createElement("option");
            option.value=key;
            option.textContent=nome.replace("_"," - ");
            lista.appendChild(option);
        }
    }
}

function novoChecklist(){
    document.querySelectorAll("input").forEach(i=>i.value="");
    document.querySelectorAll("select").forEach(s=>{s.value="";s.className="";});
}

criarTabela();
atualizarLista();

</script>

</body>
</html>
