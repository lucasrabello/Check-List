<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checklist Profissional</title>

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            background-color: #f2f2f2;
            color: #333;
        }

        header {
            background-color: #2c3e50;
            color: white;
            padding: 20px;
        }

        header h1 {
            margin: 0 0 15px 0;
        }

        .header-form {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .header-form div {
            display: flex;
            flex-direction: column;
            font-size: 14px;
        }

        .header-form input {
            padding: 8px;
            border-radius: 5px;
            border: 1px solid #ccc;
            margin-top: 5px;
        }

        .container {
            padding: 30px;
            max-width: 1200px;
            margin: auto;
        }

        .group {
            background: white;
            padding: 20px;
            margin-bottom: 30px;
            border-radius: 10px;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.1);
        }

        .group h2 {
            margin-top: 0;
            border-bottom: 2px solid #ddd;
            padding-bottom: 10px;
            color: #2c3e50;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th,
        td {
            padding: 10px;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: #ecf0f1;
            text-align: left;
        }

        select {
            padding: 6px;
            border-radius: 5px;
            border: 1px solid #ccc;
            font-weight: bold;
            min-width: 120px;
        }

        .sim {
            background-color: #2ecc71;
            color: white;
        }

        .nao {
            background-color: #e74c3c;
            color: white;
        }

        .pendente {
            background-color: #f1c40f;
            color: black;
        }

        footer {
            text-align: center;
            padding: 15px;
            font-size: 13px;
            color: #777;
        }
    </style>
</head>

<body>

    <header>
        <h1>Checklist Técnico</h1>
        <div class="header-form">
            <div>
                <label>Cliente</label>
                <input type="text" placeholder="Nome do cliente">
            </div>
            <div>
                <label>Ambiente</label>
                <input type="text" placeholder="Local da vistoria">
            </div>
            <div>
                <label>Data de Início</label>
                <input type="date">
            </div>
            <div>
                <label>Data de Fim</label>
                <input type="date">
            </div>
            <div>
                <label>Responsável</label>
                <input type="text" placeholder="Nome do responsável">
            </div>
        </div>
    </header>

    <div class="container" id="checklistContainer"></div>

    <footer>
        Sistema de Checklist Profissional
    </footer>

    <script>
        function criarGrupo(numeroGrupo) {
            const container = document.getElementById("checklistContainer");

            const divGrupo = document.createElement("div");
            divGrupo.className = "group";

            let html = `<h2>Grupo ${numeroGrupo}</h2>`;
            html += `<table>
                <tr>
                    <th>Subgrupo</th>
                    <th>Status</th>
                </tr>`;

            for (let i = 1; i <= 10; i++) {
                html += `
        <tr>
            <td>Item ${numeroGrupo}.${i}</td>
            <td>
                <select onchange="mudarCor(this)">
                    <option value="">Selecione</option>
                    <option value="sim">Sim</option>
                    <option value="nao">Não</option>
                    <option value="pendente">Pendente</option>
                </select>
            </td>
        </tr>`;
            }

            html += `</table>`;
            divGrupo.innerHTML = html;
            container.appendChild(divGrupo);
        }

        function mudarCor(select) {
            select.classList.remove("sim", "nao", "pendente");

            if (select.value === "sim") {
                select.classList.add("sim");
            } else if (select.value === "nao") {
                select.classList.add("nao");
            } else if (select.value === "pendente") {
                select.classList.add("pendente");
            }
        }

        for (let g = 1; g <= 5; g++) {
            criarGrupo(g);
        }
    </script>

</body>

</html>
